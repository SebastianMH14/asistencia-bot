[project]
name = "asistencia-bot"
version = "0.1.0"
description = "Exporta cada lunes los registros de entradas y salidas de HikCentral y los envía por correo al jefe de cada grupo."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
asistencia-bot = "asistencia_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistencia_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # los bloques de código de la documentación son ilustrativos

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N818: las excepciones siguen la convención en español con prefijo (ErrorLogin, ErrorCaptura).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Scripts de exploración de la Fase 1: llevan JavaScript embebido y no son código de producción.
"exploracion/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hikcentral: pruebas de integración contra HikCentral real; solo se corren a mano en el equipo del cliente",
]
addopts = "-m 'not hikcentral'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
]
