[project]
name = "asistencia-bot"
version = "0.1.0"
description = "Exporta cada lunes los registros de entradas y salidas de HikCentral y los envía por correo al jefe de cada grupo."
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "playwright>=1.64.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
asistencia-bot = "asistencia_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistencia_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hikcentral: pruebas de integración contra HikCentral real; solo se corren a mano en el equipo del cliente",
]
addopts = "-m 'not hikcentral'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
